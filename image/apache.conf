#
# Serves Nextcloud from /usr/src/nextcloud. /var/www/html is a volume in the
# base image, and Docker copies a volume's image content into every new container.
<Directory /usr/src/nextcloud/>
	Options -Indexes +FollowSymLinks
	AllowOverride All
	Require all granted
</Directory>

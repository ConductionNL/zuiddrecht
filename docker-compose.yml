#
# Gemeente Zuiddrecht demo: docker compose up -d, then open http://localhost:8080
#
# Both images carry the installed demo, so nothing installs at start. The
# demo lives in the containers: `docker compose down` throws it away and the
# next `up` starts clean.

name: zuiddrecht

services:
  db:
    image: ghcr.io/conductionnl/zuiddrecht-db:${ZUIDDRECHT_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-h", "localhost", "-U", "nextcloud", "-d", "nextcloud"]
      interval: 30s
      start_period: 60s
      start_interval: 1s

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  nextcloud:
    image: ghcr.io/conductionnl/zuiddrecht:${ZUIDDRECHT_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${PORT:-8080}:80"
    environment:
      REDIS_HOST: redis
      NEXTCLOUD_TRUSTED_DOMAINS: ${TRUSTED_DOMAINS:-localhost 127.0.0.1}
      OVERWRITEPROTOCOL: ${OVERWRITE_PROTOCOL:-}
      OVERWRITECLIURL: ${OVERWRITE_CLI_URL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      DEMO_LANGUAGE: ${DEMO_LANGUAGE:-nl}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/status.php | grep -q '\"installed\":true'"]
      interval: 30s
      start_period: 180s
      start_interval: 1s

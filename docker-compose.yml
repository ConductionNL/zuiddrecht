# Gemeente Zuiddrecht demo: docker compose up -d, then open http://localhost:8080

name: zuiddrecht

x-nextcloud: &nextcloud
  image: ghcr.io/conductionnl/zuiddrecht:${ZUIDDRECHT_TAG:-latest}
  restart: unless-stopped
  volumes:
    - nextcloud:/var/www/html
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zuiddrecht}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  nextcloud:
    <<: *nextcloud
    ports:
      - "${PORT:-8080}:80"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zuiddrecht}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      NEXTCLOUD_TRUSTED_DOMAINS: ${TRUSTED_DOMAINS:-localhost 127.0.0.1}
      OVERWRITEPROTOCOL: ${OVERWRITE_PROTOCOL:-}
      OVERWRITECLIURL: ${OVERWRITE_CLI_URL:-}
      DEMO_LANGUAGE: ${DEMO_LANGUAGE:-nl}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/status.php | grep -q '\"installed\":true'"]
      interval: 10s
      retries: 30
      start_period: 60s

  cron:
    <<: *nextcloud
    entrypoint: /cron.sh
    depends_on:
      nextcloud:
        condition: service_healthy

volumes:
  db:
  nextcloud:

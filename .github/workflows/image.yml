name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/conductionnl/zuiddrecht

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot the demo from a fresh build
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Theme, apps and demo seed are in place
        run: |
          occ() { docker compose exec -T -u www-data nextcloud php occ "$@"; }
          occ app:list --enabled | grep -E '^\s+- (thematiq|launchpad):'
          occ config:app:get thematiq token_set | grep -x zuiddrecht
          occ user:info pieter
          curl -fs http://localhost:8080/login | grep -qi zuiddrecht
      - name: Logs
        if: failure()
        run: docker compose logs nextcloud

  publish:
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
